<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>도전 DMC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>

<section class="screen on" id="s-start">
  <h1>도전<br><span>DMC</span></h1>
  <p class="lead">검진 기다리면서 퀴즈 풀고 이번주 1등 선물 받으세요!</p>
  <div><label for="name">이름</label><input id="name" type="text" maxlength="10" autocomplete="name" placeholder="홍길동"></div>
  <div><label for="phone">연락처 (선물 발송용)</label><input id="phone" type="tel" inputmode="numeric" maxlength="13" autocomplete="tel" placeholder="010-0000-0000"></div>
  <label class="chk"><input id="agree" type="checkbox"><span>이벤트 당첨 안내와 선물 발송을 위해 이름·연락처를 수집하는 데 동의합니다. 수집 목적 달성 후 지체 없이 파기합니다.</span></label>
  <p class="err" id="err"></p>
  <button class="btn" id="go">도전 시작</button>
  <p class="note">랭킹은 매주 월요일에 초기화됩니다. 순위표에는 연락처 뒷자리 4자리만 표시됩니다.</p>
</section>

<section class="screen" id="s-q">
  <div class="top"><span id="qn"></span><span id="tm"></span></div>
  <div class="bar" id="bar"><i></i></div>
  <p class="q" id="qt"></p>
  <div class="opts" id="opts"></div>
</section>

<section class="screen" id="s-a">
  <div class="top"><span id="an"></span><span id="pt"></span></div>
  <p class="verdict" id="vd"></p>
  <div class="ans"><b id="at"></b></div>
  <p class="exp" id="ex"></p>
  <button class="btn" id="next" style="margin-top:auto">다음 문제</button>
</section>

<section class="screen" id="s-r">
  <p class="lead" id="rwho"></p>
  <p class="score" id="rs"></p>
  <p class="lead" id="rsub"></p>
  <b>이번 주 랭킹</b>
  <ol id="board"></ol>
  <p class="note" id="rnote"></p>
  <button class="btn" id="again">다시 도전</button>
</section>

</main>
<script src="script.js"></script>
</body>
</html>
